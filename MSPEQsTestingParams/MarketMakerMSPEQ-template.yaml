# MarketMakerMSPEQ Base Parameters Template
# ==========================================
#
# Usage:
#   npm run histSim -- -b MSPEQsTestingParams/MarketMakerMSPEQ-template.yaml -s MarketMakerMSPEQ -M btc-hourly -p 150 -m 75 -c btc
#
# This file contains the base parameters for MarketMakerMSPEQ strategy.
# Stage 2 optimization will freeze these and only optimize the MSPEQ coefficients.
#
# Note: MSPEQ coefficients (profitMargin_*, spreadDistance_*, etc.) are NOT needed here.
# The optimizer generates them within bounds defined in src/simulation/index.ts.

params:
  # Base spread configuration
  spreadSize: 4
  baseSpreadDistance: 0.02
  baseProfitMargin: 0.05

  # Base price bounds (dynamically scaled by MSPEQs)
  baseMinPrice: 0.10
  baseMaxPrice: 0.20

  # Risk management
  baseStopLossAmount: 0.10
  buyExpirySeconds: 60

  # Position limits
  totalActiveTrades: 6

  # Volatility filter
  maxVolatility: 150
  minVolatility: 50
  volatilityLookbackPeriods: 210

  # Standard parameters
  targetDollars: 10
  baseCutoffMinute: 30
  candleSizeReference: 30
