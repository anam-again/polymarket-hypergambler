# Genetic Optimized Writer Configuration
# This file configures which bot/market combinations to optimize

settings:
  lookbackDays: 7          # Days of historical data to use (increased from 3 — all prior
                           # genetic yamls used only 1-3 days and overfit badly in live trading)
  maxGenerations: 20       # Maximum optimization generations (increased from 12)
  populationSize: 75       # Population size per generation
  intervalHours: 24        # Hours between optimization runs (changed from 8 — daily re-opt
                           # is safer than 3x/day to avoid chasing short-term noise)
  concurrentSimulations: 2 # Number of simulations to run in parallel

# List of bot/market combinations to optimize
# Each target will be optimized sequentially
targets:

  
  - botStyle: MarketMaker
    market: btc-hourly

  - botStyle: QuarterlyTrendFollowing
    market: btc-quarterly
  - botStyle: QuarterlyTrendFollowing
    market: eth-quarterly
  - botStyle: QuarterlyTrendFollowing
    market: sol-quarterly
  - botStyle: QuarterlyTrendFollowing
    market: xrp-quarterly

  - botStyle: QuarterlyEarlyBuyerV2
    market: btc-quarterly
  - botStyle: QuarterlyEarlyBuyerV2
    market: eth-quarterly
  - botStyle: QuarterlyEarlyBuyerV2
    market: sol-quarterly
  - botStyle: QuarterlyEarlyBuyerV2
    market: xrp-quarterly

  - botStyle: QuarterlyFirstCandle
    market: btc-quarterly
  - botStyle: QuarterlyFirstCandle
    market: eth-quarterly
  - botStyle: QuarterlyFirstCandle
    market: sol-quarterly
  - botStyle: QuarterlyFirstCandle
    market: xrp-quarterly

  - botStyle: QuarterlyMeanReversion
    market: btc-quarterly
  - botStyle: QuarterlyMeanReversion
    market: eth-quarterly
  - botStyle: QuarterlyMeanReversion
    market: sol-quarterly
  - botStyle: QuarterlyMeanReversion
    market: xrp-quarterly


# Available botStyles:
#   Hourly: Contrarian, TrendFollowing, FirstCandle, FirstCandleV2, EveningStar,
#           MorningStar, MeanReversion, NCandle, EarlyBuyerV2, EsotericNormalization, MarketMaker
#
#   Quarterly: QuarterlyFirstCandle, QuarterlyMeanReversion, QuarterlyTrendFollowing,
#              QuarterlyNCandle, QuarterlyEarlyBuyerV2, QuarterlyEsotericNormalization, QuarterlyMarketMaker
#
# Available markets:
#   btc-hourly, btc-quarterly, eth-hourly, eth-quarterly,
#   sol-hourly, sol-quarterly, xrp-hourly, xrp-quarterly
