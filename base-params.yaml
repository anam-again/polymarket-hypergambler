# CLI Flag:
# -b, --base-params <file>   Load base params from YAML and run Stage 2 only

# NPM Scripts:
# npm run mspeq               # Full two-stage optimization
# npm run mspeq:stage2 <file> # Stage 2 only with user-supplied base params

# Usage

# Step 1: Run FirstCandle to get good base params:
# npm run histSim -- -s FirstCandle -p 100 -m 50 -c btc

# Step 2: Create a YAML file with base params (or use output from a previous run):
# # base-params.yaml
# params:
#   targetDollars: 10
#   candleMinutes: 15
#   breakoutBuffer: 120
#   pullbackBuffer: 80
#   cutoffMinute: 45
#   candleSizeReference: 1000
#   baseBuyPrice: 0.45
#   minProfitMargin: 0.15

# Step 3: Run Stage 2 only:
# npm run mspeq:stage2 base-params.yaml -- -p 150 -m 75 -c btc
# # or
# npm run histSim -- --base-params base-params.yaml -p 150 -m 75 -c btc

# This allows you to experiment with different MSPEQ configurations while keeping base params fixed.


params:
  targetDollars: 10
  candleMinutes: 10
  breakoutBuffer: 50
  pullbackBuffer: 10
  cutoffMinute: 12
  candleSizeReference: 1000
  baseBuyPrice: 0.65
  minProfitMargin: 0.20
